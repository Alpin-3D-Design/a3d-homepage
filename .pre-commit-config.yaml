# pre-commit-Hooks für die Alpin 3D Design Website
# Einrichtung:  pip install pre-commit  &&  pre-commit install
# Alle Dateien prüfen:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: prettier
        name: prettier (HTML, CSS, JS, YAML, Markdown)
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: [prettier@3.3.3]
        types_or: [html, css, javascript, yaml, markdown]
